# dsh-activity-line bundle patch
#
# The `dsh.bundle.patch` layer of this package: installing it through the CLI —
#
#   dsh plugin --profile web add link:/path/to/dsh-activity-line
#
# — appends `dsh-activity-line` to `dsh.profile.bundles`, and profile boot merges
# this patch (a single `insert` of the plugin row) exactly like a manual
# cordis.patch.yml mount line. The same row is the `dsh.client` browser-roster entry
# the web modules half scans for the client bundle
# (exports["./client"] -> client.js).
- insert:
    - id: activity-line
      name: 'dsh-activity-line'
