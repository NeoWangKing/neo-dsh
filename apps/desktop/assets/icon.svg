<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Neo DSH">
  <title>Neo DSH</title>
  <desc>An N drawn as a node graph on an ink plate, with a spark. The project's own mark: the harness is a tree of plugins, and N is for Neo.</desc>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A2130"/>
      <stop offset="0.55" stop-color="#121722"/>
      <stop offset="1" stop-color="#0A0D13"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="300" y1="320" x2="700" y2="740">
      <stop offset="0" stop-color="#F4F7FB"/>
      <stop offset="1" stop-color="#AEBACB"/>
    </linearGradient>
    <linearGradient id="spark" gradientUnits="userSpaceOnUse" x1="760" y1="150" x2="900" y2="300">
      <stop offset="0" stop-color="#FFE07A"/>
      <stop offset="1" stop-color="#FF9B3D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#3AA0FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3AA0FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- plate -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#plate)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#glow)"/>
  <rect x="30" y="30" width="964" height="964" rx="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="6"/>

  <!-- the N, drawn as a node graph: two uprights joined by a diagonal -->
  <g stroke="url(#ink)" stroke-width="92" stroke-linecap="round" fill="none">
    <path d="M320 704 V344"/>
    <path d="M664 704 V344"/>
    <path d="M320 344 L664 704"/>
  </g>

  <!-- nodes -->
  <g fill="url(#ink)">
    <circle cx="320" cy="344" r="64"/>
    <circle cx="664" cy="344" r="64"/>
    <circle cx="320" cy="704" r="64"/>
    <circle cx="664" cy="704" r="64"/>
  </g>

  <!-- spark: the 灵 in 灵其啊 -->
  <path d="M824 150 L850 222 L922 248 L850 274 L824 346 L798 274 L726 248 L798 222 Z" fill="url(#spark)"/>
</svg>
