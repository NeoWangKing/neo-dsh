- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
        name: 仅可查看
        description: 只读：任何修改都会被沙箱拒绝。
      workspace-write:
        sandbox: workspace-write
        approval: ask
        name: 工作区内修改
        description: 可以改工作区内的文件；需要越界时会问你。
      smart-approval:
        sandbox: workspace-write
        approval: ask
        name: 智能批准
        description: 只读命令、项目内的依赖安装与拉取自动放行；提权、删除、动系统、越出工作区仍然会问你。
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: 完全权限
        description: 不再限制文件改动，也不再询问。
    defaultPreset: smart-approval

# 官方把三个 flash 合并成了一个模型（deepseek-flash / deepseek-v4-flash /
# deepseek-v4-flash-vision-exp 现在指向同一个东西），所以目录里只留一个
# DeepSeek-Flash：能看图（vision 那条并入其中），上下文 1M。
# 目录是整份替换的，因此把仍然独立的 DeepSeek-V4-Pro 一起写在这里。
# 旧会话里钉着老 id 的仍然能继续跑：目录里找不到就按裸 id 直接发给 API。
- id: llm-deepseek
  config:
    models:
      - id: deepseek-flash
        name: DeepSeek-Flash
        description: 快速、经济，适合日常、例行和并行任务；文本与图片都能收。
        contextWindow: 1000000
        inputModalities: [text, image]
        systemPromptUpdate: in-history
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
        description: 更强的 agentic 编码、知识与难题推理；适合复杂或对质量要求高的任务，成本更高。
        contextWindow: 1000000
