# Build and package the desktop app.
#
# Each platform is packaged ON ITS OWN RUNNER on purpose: the harness depends on
# platform-specific optional binaries (Landlock for Linux, node-addon-system,
# sharp, koffi, ripgrep), so a Linux runner cannot assemble a correct macOS or
# Windows payload.
#
# One job per platform instead of a matrix with `if: matrix.…`: job-level `if`
# cannot read the matrix context, and a step-level skip still makes GitHub
# allocate the runner. With the retired macos-13 label that turned every push into
# a queue wait behind a macOS runner the build never needed. Plain per-job
# conditions using only the `github` context avoid both problems —
# `github.event.inputs` is readable on every event (empty for a push).
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated targets to build: linux, mac, win'
        default: linux
        type: string

# The event name and the selected platforms are part of the group on purpose: a
# manual macOS/Windows dispatch used to land in the same group as a push to main
# and cancel it, so a pushed commit showed "cancelled" checks for no reason.
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.platforms || 'default' }}
  cancel-in-progress: true

# Creating the GitHub Release needs write access: a new repository's default token
# is read-only, and the release step then fails with `Resource not accessible by
# integration` (403) *after* a successful build.
permissions:
  contents: write

jobs:
  linux:
    name: linux-x64
    if: ${{ github.event_name != 'workflow_dispatch' || contains(github.event.inputs.platforms, 'linux') }}
    runs-on: ubuntu-latest
    env:
      ARTIFACT_NAME: neo-dsh-linux-x64
      BUILD_ARGS: --linux
    steps: &build-steps
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install the app
        run: pnpm --dir apps/desktop install --frozen-lockfile
      - name: Assemble shipped resources
        run: node scripts/build-resources.mjs
      - name: Fetch the Node runtime this platform ships
        run: node scripts/fetch-node.mjs
      - name: Package
        shell: bash
        env:
          # Unsigned by default. Provide CSC_LINK/CSC_KEY_PASSWORD (and the
          # notarization variables) to sign, and drop this line.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --dir apps/desktop exec electron-builder ${{ env.BUILD_ARGS }} --publish never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.zip
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.zip
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe

  # Apple Silicon only, by decision: GitHub's Intel macOS label (macos-13) queues
  # indefinitely, so an Intel dmg would need a cross-arch install on macos-14
  # (pnpm supportedArchitectures) instead. Out of scope for now — see the README.
  macos-arm64:
    name: macos-arm64
    # Also on a version tag: otherwise a Release only ever carries Linux.
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.platforms, 'mac')) }}
    runs-on: macos-14
    env:
      ARTIFACT_NAME: neo-dsh-macos-arm64
      BUILD_ARGS: --mac --arm64
    steps: *build-steps

  windows-x64:
    name: windows-x64
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.platforms, 'win')) }}
    runs-on: windows-latest
    env:
      ARTIFACT_NAME: neo-dsh-windows-x64
      BUILD_ARGS: --win
    steps: *build-steps
